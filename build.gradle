plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.co.seoulit'
version = '0.0.1-SNAPSHOT'
description = 'demo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web MVC (Spring Boot 4.x: spring-boot-starter-web -> spring-boot-starter-webmvc)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // MyBatis (메뉴 등 XML SQL 매퍼)
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    // JPA (엔티티 기반 ORM)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // MapStruct (DTO <-> Entity 매핑)
    implementation 'org.mapstruct:mapstruct:1.6.3'
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    // 개발용 자동 재시작
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // Oracle JDBC 드라이버
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
    // Annotation Processors
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    // Bean Validation (요청 DTO 입력값 검증 — 가이드 §11.5)
    // 이 의존성이 없으면 @NotBlank 등을 달아도 검증기가 없어 조용히 통과한다.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // OpenAPI 3 + Swagger UI
    // 의존성만 추가하면 컨트롤러의 @RequestMapping·파라미터·DTO 구조를 읽어
    // http://localhost:8383/swagger-ui.html 에 API 목록을 자동으로 그린다.
    // 어노테이션(@Operation 등)은 필수가 아니며, 설명을 더하고 싶을 때만 붙인다.
    //
    // 버전 주의 — springdoc 3.x 가 Spring Boot 4.x 용이다.
    // adminservice·patient-service 와 같은 3.0.3 으로 맞췄다.
    // (2.x 는 Boot 3 용이라 Boot 4 에서는 동작이 보장되지 않는다)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
}

tasks.named('test') {
    useJUnitPlatform()
}
