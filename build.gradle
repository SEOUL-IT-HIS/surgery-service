plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.co.seoulit'
version = '0.0.1-SNAPSHOT'
description = 'demo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web MVC (Spring Boot 4.x: spring-boot-starter-web -> spring-boot-starter-webmvc)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Spring Boot 4 부터 RestTemplate/RestClient 지원이 별도 모듈로 분리됐다.
	// starter-webmvc 만으로는 RestTemplateBuilder 가 클래스패스에 없다.
	// 패키지도 Boot 3 의 org.springframework.boot.web.client 에서
	// org.springframework.boot.restclient 로 옮겨졌다.
	// lab-imaging-service 도 같은 이유로 이 의존성을 넣어 두었다.
	implementation 'org.springframework.boot:spring-boot-restclient'
    // MyBatis (메뉴 등 XML SQL 매퍼)
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    // JPA (엔티티 기반 ORM)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // MapStruct (DTO <-> Entity 매핑)
    implementation 'org.mapstruct:mapstruct:1.6.3'
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    // 개발용 자동 재시작
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // Oracle JDBC 드라이버
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
    // Annotation Processors
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    // Bean Validation (요청 DTO 입력값 검증 — 가이드 §11.5)
    // 이 의존성이 없으면 @NotBlank 등을 달아도 검증기가 없어 조용히 통과한다.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // OpenAPI 3 + Swagger UI
    // 의존성만 추가하면 컨트롤러의 @RequestMapping·파라미터·DTO 구조를 읽어
    // http://localhost:8084/swagger-ui.html 에 API 목록을 자동으로 그린다.
    // 어노테이션(@Operation 등)은 필수가 아니며, 설명을 더하고 싶을 때만 붙인다.
    //
    // 버전 주의 — springdoc 3.x 가 Spring Boot 4.x 용이다.
    // adminservice·patient-service 와 같은 3.0.3 으로 맞췄다.
    // (2.x 는 Boot 3 용이라 Boot 4 에서는 동작이 보장되지 않는다)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    // Kafka (수술 완료 → 수납 청구 연계, §21.3)
    //
    // 의존성 이름 주의 — Boot 4 에는 spring-boot-starter-kafka 가 없다.
    // 자동설정(KafkaAutoConfiguration / KafkaProperties)이 spring-boot-kafka 모듈에
    // 들어 있고 spring-kafka 는 여기에 딸려 온다. spring-kafka 만 넣으면
    // KafkaTemplate·KafkaAdmin 빈이 자동 생성되지 않는다.
    // (spring-boot-restclient 와 같은, Boot 4 에서 모듈이 쪼개진 사례다.
    //  lab-imaging-service 가 같은 이유로 이 이름을 쓰고 있다)
    implementation 'org.springframework.boot:spring-boot-kafka'
    // 공유 로그인 세션 — 세션을 톰캣 메모리가 아니라 Redis 에 둔다.
    //
    // admin 에서 로그인한 세션을 수술이 그대로 읽으려면 저장소가 같아야 한다.
    // 각자 메모리에 두면 서비스마다 따로 로그인해야 하고, 수술 API 는 401 이 된다.
    //
    // 이름 주의 — spring-boot-starter-data-redis 가 아니다. 그쪽은 Redis 접속만
    // 붙여줄 뿐 세션 저장소를 바꾸지 않는다. 오류도 안 나고 로그인도 되는데
    // Redis 는 빈 채로 남아서, 적용됐는지 증상만으로는 구분이 안 된다.
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
}

tasks.named('test') {
    useJUnitPlatform()
}
