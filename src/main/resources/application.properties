# =============================================================================
# [백엔드 설정] application.properties - 애플리케이션 환경 설정
# -----------------------------------------------------------------------------
# 스프링 부트가 시작될 때 읽는 핵심 설정 파일. DB 접속, ORM, 파일 업로드 등을 정의.
# 주의: .properties 파일은 줄 끝(인라인) 주석을 지원하지 않으므로 주석은 반드시 별도 줄에 작성한다.
# =============================================================================

# 애플리케이션 이름
spring.application.name=surgery-service
# 서버 포트
# 2026-09-15 포트 통일: 서비스마다 번호 하나를 받아 808번호 를 쓴다. 수술은 04 번이라
# 8084 다(이전 8383). 원격 서버 바깥 포트는 18084 이며 compose 가 매핑한다.
# 프론트 next.config.ts 의 SURGERY_API_ORIGIN 과 반드시 같아야 한다.
server.port=8084

# DataSource: 접속할 데이터베이스(Oracle) 정보
# DB 주소(호스트:포트/서비스명)
# seoulit.pe.kr 은 117.16.154.233 이다. 아래 admin·Redis·Kafka 가 가리키는
# 원격 서버와 같은 장비이며, 여기만 도메인으로 적혀 있을 뿐이다.
spring.datasource.url=jdbc:oracle:thin:@seoulit.pe.kr:1521/freepdb1
# DB 계정

spring.datasource.username=SURGERY
# DB 비밀번호
# 다른 서비스도 이 파일에 평문으로 두고 있어 같은 방식을 따른다. 운영 전환 시에는
# 팀 전체가 환경변수나 외부 설정으로 함께 옮겨야 한다.
spring.datasource.password=SURGERY
# JDBC 드라이버
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

#mybatis.mapper-locations=classpath:surgery.xml

# =============================================================================
# 공유 로그인 세션 (Redis) — 2026-09-16 전 서비스 적용
# =============================================================================
# admin 에서 로그인한 세션을 수술도 그대로 읽는다. 저장소가 같아야 하므로
# 개인 PC 에서 띄울 때도 원격 주소(117.16.154.233)를 그대로 쓴다.
# localhost 로 바꾸면 나만 다른 저장소를 보게 되어 공유가 깨진다.
#
# 2026-09-17 — 팀이 서비스를 원격 서버 한 대로 모으면서 주소가
# 192.168.1.126 에서 117.16.154.233 으로 바뀌었다. DB(seoulit.pe.kr)와
# 같은 장비다.
#
# 비밀번호는 파일에 적지 않고 환경변수에서 읽는다.
#   setx REDIS_PASSWORD 값     (PowerShell, 한 번만. IntelliJ 재시작 필요)
# 기본값을 빈 문자열로 둔 이유 — 환경변수가 없으면 기동은 되고 Redis 인증에서만
# 막힌다. 여기서 터뜨리면 Redis 와 무관한 작업까지 못 하게 된다.
spring.data.redis.host=117.16.154.233
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}

# 서버 세션 (JWT 미사용)
# timeout 은 팀 전체가 10h 로 맞춘다. 서비스마다 다르면 한 화면에서는 살아 있고
# 다른 화면에서는 끊기는 상황이 생긴다.
server.servlet.session.timeout=10h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax

# JPA(Hibernate): 엔티티 기반 ORM 설정
# Oracle 방언
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
# 로그에 SQL 보기 좋게 출력
spring.jpa.properties.hibernate.format_sql=true
# 타임존(hibernate.jdbc.time_zone)은 넣지 않는다.
# patient-service·adminservice 는 Asia/Seoul 을 지정하고 있으나, 이 설정은 Instant·
# OffsetDateTime 처럼 시점을 절대값으로 갖는 타입이나 TIMESTAMP WITH TIME ZONE 컬럼에만
# 적용된다. 수술의 시간 필드는 전부 LocalDateTime·LocalDate 라 타임존 정보 자체가 없어
# 변환이 일어나지 않는다. 효과가 없는 줄을 두면 뭔가 방어되고 있다고 오해하게 된다.
#
# 참고 — 팀원마다 createdAt 시각이 어긋날 수 있는 건 위 설정과 무관하다.
# @CreationTimestamp 가 서버가 도는 PC 의 시계에서 값을 가져오기 때문이며,
# 막으려면 @CreationTimestamp(source = SourceType.DB) 로 DB 시계를 쓰거나
# 필드를 Instant 로 바꿔야 한다.

# 엔티티 변경 시 테이블 자동 반영(update)
# 다른 서비스 3곳은 validate 를 쓰지만 수술은 아직 스키마가 자주 바뀌어 update 로 둔다.
# 컬럼 추가는 해주지만 이름 변경·삭제는 하지 않는다는 점에 주의한다.
spring.jpa.hibernate.ddl-auto=update
# 실행 SQL 콘솔 출력 여부
spring.jpa.show-sql=true
# 뷰 렌더링까지 영속성 컨텍스트 유지
spring.jpa.open-in-view=true

# CORS (common/config/WebConfig)
# 프론트가 next.config.ts rewrite 로 프록시하는 동안에는 쓰이지 않는다. 브라우저가 8084 를
# 직접 부를 때만 동작한다. 키 이름은 patient-service 와 맞췄다.
# 운영 전환 시 allowed-origin-patterns 를 실제 도메인으로 좁혀야 한다.
app.cors.allowed-origin-patterns=*
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# 타 서비스 조회 (GET) — REST 직접 호출
# §21.3 은 기존 GET API 를 그대로 두라고 하므로 이 호출은 유지한다.
# 등록·상태통지 성격의 연동만 Kafka 로 옮긴다.
#
# 2026-09-17 — 팀원이 각자 PC 에서 서비스를 띄우던 방식을 접고 원격 서버 한 대로
# 모았다. 주소는 117.16.154.233 이며 DB(seoulit.pe.kr)와 같은 장비다.
# 이제는 각자 환경에 맞춰 덮어쓰지 않는다. 모두 이 주소를 본다.
#
# 포트 9191 은 팀 협의값이다. 포트 통일표(§3.2)의 admin=8080 과 다르므로
# 옛 문서를 보고 8080 으로 되돌리지 않도록 주의한다.
app.admin-service.host=117.16.154.233
app.admin-service.port=9191

# 공통코드 로컬 캐시 갱신 주기 (10분)
# 코드값은 거의 바뀌지 않으므로 짧게 잡을 이유가 없다. 짧게 두면 N+1 호출이
# 그만큼 자주 돌아 admin 에 부담만 준다.
app.admin-service.common-code.refresh-interval-ms=600000

# =============================================================================
# Kafka — 수술 완료 → 수납 청구 연계 (SL2-72, §21.3)
# =============================================================================
# 지금은 꺼져 있다. 발행 코드가 아직 없고, 보낼 메시지 모양도 수납과 확정되지
# 않았다(feeCode·receptionId·amount 를 누가 채우는지). 의존성과 설정만 먼저
# 넣어 두고, 협의가 끝나면 아래를 true 로 바꾸면서 발행을 붙인다.
#
# 브로커도 원격 서버(117.16.154.233)로 옮겼다. 2026-09-17 이전에는 검사·영상
# 담당자 PC(192.168.1.132:9092)에서 돌았다.
#
# 이 주소는 아직 실제로 발행해 본 적이 없어 검증되지 않았다. enabled 를 true 로
# 바꾸기 전에 브로커가 그 포트에 떠 있는지부터 확인한다.
#
# 브로커가 안 떠 있어도 이 설정만으로는 기동에 지장이 없다 — enabled=false 인
# 동안에는 Producer 빈 자체를 만들지 않기 때문이다.
app.kafka.enabled=false
spring.kafka.bootstrap-servers=117.16.154.233:9092

# 직렬화 — 키는 문자열(surgeryId), 값은 JSON
#
# ⚠ JacksonJsonSerializer 다. JsonSerializer 가 아니다.
#   둘은 쓰는 Jackson 이 다르다 — JsonSerializer 는 com.fasterxml(Jackson 2),
#   JacksonJsonSerializer 가 tools.jackson(Jackson 3)이고 Boot 4 는 이쪽이다.
#   잘못 쓰면 "Can't convert value of class ..." 로 발행이 실패한다.
#   (검사·영상이 2026-08-27 에 실제로 겪고 주석으로 남겨 둔 함정이다.
#    병동은 아직 JsonSerializer 로 돼 있어 서로 어긋나 있다)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# 브로커가 없어도 기동은 되도록 메타데이터 대기를 짧게 둔다.
# 이게 없으면 발행 시도가 기본 60초를 붙잡고 있다가 실패한다.
spring.kafka.producer.properties.max.block.ms=5000
