# =============================================================================
# [백엔드 설정] application.properties - 애플리케이션 환경 설정
# -----------------------------------------------------------------------------
# 스프링 부트가 시작될 때 읽는 핵심 설정 파일. DB 접속, ORM, 파일 업로드 등을 정의.
# 주의: .properties 파일은 줄 끝(인라인) 주석을 지원하지 않으므로 주석은 반드시 별도 줄에 작성한다.
# =============================================================================

# 애플리케이션 이름
spring.application.name=surgery-service
# 서버 포트
# 수술만 8383 이다. 다른 서비스는 8080(입원은 8989)을 쓰는데, 한 PC에서 여러 서비스를
# 띄울 때 겹치지 않게 서비스별로 나눠 쓴 결과다. 프론트 next.config.ts 의
# SURGERY_API_ORIGIN 과 반드시 같아야 한다.
server.port=8383

# DataSource: 접속할 데이터베이스(Oracle) 정보
# DB 주소(호스트:포트/서비스명)
spring.datasource.url=jdbc:oracle:thin:@seoulit.pe.kr:1521/freepdb1
# DB 계정

spring.datasource.username=SURGERY
# DB 비밀번호
# 다른 서비스도 이 파일에 평문으로 두고 있어 같은 방식을 따른다. 운영 전환 시에는
# 팀 전체가 환경변수나 외부 설정으로 함께 옮겨야 한다.
spring.datasource.password=SURGERY
# JDBC 드라이버
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA(Hibernate): 엔티티 기반 ORM 설정
# Oracle 방언
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
# 로그에 SQL 보기 좋게 출력
spring.jpa.properties.hibernate.format_sql=true
# 타임존(hibernate.jdbc.time_zone)은 넣지 않는다.
# patient-service·adminservice 는 Asia/Seoul 을 지정하고 있으나, 이 설정은 Instant·
# OffsetDateTime 처럼 시점을 절대값으로 갖는 타입이나 TIMESTAMP WITH TIME ZONE 컬럼에만
# 적용된다. 수술의 시간 필드는 전부 LocalDateTime·LocalDate 라 타임존 정보 자체가 없어
# 변환이 일어나지 않는다. 효과가 없는 줄을 두면 뭔가 방어되고 있다고 오해하게 된다.
#
# 참고 — 팀원마다 createdAt 시각이 어긋날 수 있는 건 위 설정과 무관하다.
# @CreationTimestamp 가 서버가 도는 PC 의 시계에서 값을 가져오기 때문이며,
# 막으려면 @CreationTimestamp(source = SourceType.DB) 로 DB 시계를 쓰거나
# 필드를 Instant 로 바꿔야 한다.

# 엔티티 변경 시 테이블 자동 반영(update)
# 다른 서비스 3곳은 validate 를 쓰지만 수술은 아직 스키마가 자주 바뀌어 update 로 둔다.
# 컬럼 추가는 해주지만 이름 변경·삭제는 하지 않는다는 점에 주의한다.
spring.jpa.hibernate.ddl-auto=update
# 실행 SQL 콘솔 출력 여부
spring.jpa.show-sql=true
# 뷰 렌더링까지 영속성 컨텍스트 유지
spring.jpa.open-in-view=true
