# =============================================================================
# [백엔드 설정] application.properties - 애플리케이션 환경 설정
# -----------------------------------------------------------------------------
# 스프링 부트가 시작될 때 읽는 핵심 설정 파일. DB 접속, ORM, 파일 업로드 등을 정의.
# 주의: .properties 파일은 줄 끝(인라인) 주석을 지원하지 않으므로 주석은 반드시 별도 줄에 작성한다.
# =============================================================================

# 애플리케이션 이름
spring.application.name=demo
# 서버 포트(프론트 axios baseURL과 일치해야 함)
server.port=8383

# DataSource: 접속할 데이터베이스(Oracle) 정보
# DB 주소(호스트:포트:SID)
spring.datasource.url=jdbc:oracle:thin:@seoulit.pe.kr:1521/freepdb1
# DB 계정
spring.datasource.username=his
# DB 비밀번호(운영 시 외부화 권장)
spring.datasource.password=his
# JDBC 드라이버
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# MyBatis: 메뉴 등 SQL을 XML로 작성하는 ORM 설정
# 매퍼 XML 위치
mybatis.mapper-locations=classpath:mapper/*.xml
# DTO 별칭 패키지(하위 패키지까지 스캔)
mybatis.type-aliases-package=kr.co.seoulit.hisback.surgery

# JPA(Hibernate): 직원/사진 등 엔티티 기반 ORM 설정
# Oracle 방언
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
# 로그에 SQL 보기 좋게 출력
spring.jpa.properties.hibernate.format_sql=true
# 엔티티 변경 시 테이블 자동 반영(update)
spring.jpa.hibernate.ddl-auto=update
# 실행 SQL 콘솔 출력 여부
spring.jpa.show-sql=false
# 뷰 렌더링까지 영속성 컨텍스트 유지
spring.jpa.open-in-view=true

# SeaweedFS S3: 직원 사진을 저장하는 외부 오브젝트 스토리지 정보
# 스토리지 엔드포인트(원격 서버 — 로컬 테스트 시 http://localhost:8888 로 변경)
seaweedfs.s3.endpoint=http://192.168.1.125:8888
# 사진 저장 버킷명(경로)
seaweedfs.s3.bucket=bucket/photo

# =============================================================================
# Kafka: 서비스 간 이벤트 발행 설정 (가이드 §21.3 "서비스 간 데이터 교환은 REST API 또는 Event")
# 로컬 Kafka 4.x는 KRaft 모드라 ZooKeeper 설정이 없다(4.x는 KRaft only).
# =============================================================================
# 브로커 주소(로컬 개발용. 운영은 사내 브로커 주소로 외부화)
spring.kafka.bootstrap-servers=localhost:9092
# 메시지 키 직렬화(문자열 — 수술ID를 키로 사용해 동일 수술 이벤트의 순서를 보장)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# 메시지 값 직렬화(JSON — 이벤트 DTO를 그대로 직렬화)
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# 청구 연계 누락을 막기 위해 모든 복제본 확인(acks=all) + 재시도
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
# JsonSerializer가 기본으로 붙이는 __TypeId__(자바 클래스명) 헤더를 끈다.
# 이 헤더가 붙으면 수신 측(수납)이 동일한 자바 클래스를 갖고 있어야 역직렬화돼서
# 서비스 간 결합이 생긴다(§21.9). 순수 JSON 계약으로 주고받기 위해 false로 둔다.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# 토픽명: 타 서비스(수납)가 구독하므로 임의 변경 금지 — 변경 시 수납팀과 합의 필요
surgery.kafka.topic.surgery-completed=surgery.completed

# File Upload: 멀티파트 업로드 용량 제한(사진 업로드용)
# 파일 1개 최대 크기
spring.servlet.multipart.max-file-size=10MB
# 요청 전체 최대 크기
spring.servlet.multipart.max-request-size=10MB
